services:
  - type: web
    name: ecoparce
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60"
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings.render"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ecoparce-db
          property: connectionString
      - key: ADMIN_PRINCIPAL_CORREO
        value: "fjnv1305@gmail.com"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MFA_CLAVE_CIFRADO
        sync: false
      - key: DB_CLAVE_CIFRADO
        sync: false
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SSL
        value: "1"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: CORREO_REMITENTE
        sync: false
      - key: VERIFICAR_CORREO_POR_CODIGO
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: EMPRESA_PRODUCTOS_API_URL
        sync: false
      - key: EMPRESA_PRODUCTOS_API_KEY
        sync: false

databases:
  - name: ecoparce-db
    plan: free
    databaseName: ecoparce
    user: ecoparce
