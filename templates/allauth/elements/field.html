{% load allauth %}{{ attrs.errors }}
<div class="campo">
{% if attrs.type == 'checkbox' or attrs.type == 'radio' %}
<label class="check"><input type="{{ attrs.type }}"{% if attrs.name %} name="{{ attrs.name }}"{% endif %}{% if attrs.id %} id="{{ attrs.id }}"{% endif %}{% if attrs.checked %} checked{% endif %}{% if attrs.value is not None %} value="{{ attrs.value }}"{% endif %}> {% slot label %}{% endslot %}</label>
{% else %}
<label for="{{ attrs.id }}">{% slot label %}{% endslot %}</label>
<input type="{{ attrs.type }}"{% if attrs.name %} name="{{ attrs.name }}"{% endif %}{% if attrs.id %} id="{{ attrs.id }}"{% endif %}{% if attrs.value is not None %} value="{{ attrs.value }}"{% endif %}{% if attrs.required %} required{% endif %}{% if attrs.disabled %} disabled{% endif %}{% if attrs.readonly %} readonly{% endif %}{% if attrs.autocomplete %} autocomplete="{{ attrs.autocomplete }}"{% endif %}{% if attrs.placeholder %} placeholder="{{ attrs.placeholder }}"{% endif %}>
{% endif %}
{% if slots.help_text %}<div class="ayuda">{% slot help_text %}{% endslot %}</div>{% endif %}
</div>
